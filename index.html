
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
<header>
    <h1>📋 My To-Do List</h1>
    <p>Small steps. Big progress. ✨</p>

    <img
        src="checklist.jpg"
        alt="Stay organized illustration"
        class="banner-image">

    <p>
        Click to View my 
        <a href="https://www.linkedin.com/in/vinisha-reddy-bisidi-2477b3343" target="_blank">
            LinkedIn Profile
        </a>
    </p>
</header>


        <div class="input-area">
            <input type="text" id="taskInput"
                   placeholder="Enter a new task...">
            <button id="addBtn">+ Add Task</button>
        </div>

        <section class="tasks">
            <h2>Tasks <span id="count">0</span></h2>
            <ul id="taskList"></ul>
        </section>

        <footer>Keep going! 💜</footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
